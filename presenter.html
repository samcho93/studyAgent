<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발표자 창 · AI 에이전트 구축 강좌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗒️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    :root { --bg: #111418; --panel: #1a1f27; --line: #2b323d; --text: #e7eaf0; --muted: #8f98a8; --accent: #ff9a3c; --accent2: #6aa8ea; --ok: #4cc983; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif; }
    header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
    #lesson { font-size: 14px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #clock { font: 700 30px ui-monospace, Consolas, monospace; letter-spacing: .02em; cursor: pointer; }
    #clock.over { color: #ff6b61; }
    button { font-weight: 600; font-size: 14px; font-family: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
    .cur { padding: 18px 22px; overflow: auto; }
    .count { color: var(--accent); font-weight: 800; font-size: 15px; }
    h1 { font-size: 30px; margin: 4px 0 14px; line-height: 1.3; }
    #notes { font-size: 21px; line-height: 1.7; }
    #notes p { margin: 0 0 10px; }
    #notes ul { margin: 0 0 10px; }
    #notes .muted { color: var(--muted); font-size: 17px; }
    #notes code { background: #262d38; padding: 0 5px; border-radius: 4px; font-size: .9em; }
    #notes b { color: var(--accent2); }
    aside { border-left: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
    .label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; }
    #next { font-size: 19px; font-weight: 700; }
    #sched div { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
    footer { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
    footer button { flex: 1; font-size: 20px; padding: 14px; }
    #waiting { color: #f5a352; }
  </style>
</head>
<body>
  <header>
    <span id="lesson">강좌 창에서 교사용 슬라이드를 열어 두세요… <span id="waiting">(연결 대기 중)</span></span>
    <span id="clock" title="클릭: 시작/일시정지">00:00</span>
    <button id="clockBtn">▶ 시작</button>
    <button id="resetBtn">↺</button>
  </header>
  <main>
    <section class="cur">
      <div class="count" id="count">– / –</div>
      <h1 id="title">발표자 창</h1>
      <div id="notes"><p class="muted">이 창은 강좌 창의 슬라이드와 자동으로 연결됩니다. 프로젝터에는 강좌 창을 전체 화면(F)으로, 이 창은 교사 모니터에 띄우세요.
        키보드 ← → 또는 아래 버튼으로 슬라이드를 넘길 수 있습니다.</p></div>
    </section>
    <aside>
      <div><div class="label">다음 슬라이드</div><div id="next">–</div></div>
      <div><div class="label">수업 흐름</div><div id="sched"></div></div>
    </aside>
  </main>
  <footer><button id="prev">◀ 이전</button><button id="nextBtn">다음 ▶</button></footer>
  <script>
    const ch = new BroadcastChannel('python-presenter');
    const $ = (id) => document.getElementById(id);
    let limit = 50;
    ch.onmessage = (ev) => {
      const m = ev.data || {};
      if (m.type !== 'state') return;
      $('lesson').textContent = m.lesson;
      $('count').textContent = `${m.index + 1} / ${m.total}`;
      $('title').innerHTML = m.title;
      $('notes').innerHTML = m.notes || '<p class="muted">노트 없음</p>';
      $('next').innerHTML = m.next || '섹션의 마지막 슬라이드';
      limit = m.minutes || 50;
      $('sched').innerHTML = (m.schedule || []).map(([n, t]) => `<div><span>${n}</span><b>${t}분</b></div>`).join('');
    };
    const nav = (dir) => ch.postMessage({ type: 'nav', dir });
    $('prev').onclick = () => nav(-1);
    $('nextBtn').onclick = () => nav(1);
    document.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { nav(1); e.preventDefault(); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { nav(-1); e.preventDefault(); }
    });
    ch.postMessage({ type: 'hello' });
    setInterval(() => ch.postMessage({ type: 'hello' }), 3000);

    let start = null, acc = 0;
    const draw = () => {
      const ms = acc + (start ? Date.now() - start : 0);
      const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
      $('clock').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      $('clock').classList.toggle('over', m >= limit);
    };
    const toggle = () => {
      if (start) { acc += Date.now() - start; start = null; $('clockBtn').textContent = '▶ 시작'; }
      else { start = Date.now(); $('clockBtn').textContent = '⏸ 정지'; }
      draw();
    };
    $('clockBtn').onclick = toggle; $('clock').onclick = toggle;
    $('resetBtn').onclick = () => { acc = 0; if (start) start = Date.now(); draw(); };
    setInterval(draw, 500);
  </script>
</body>
</html>
